# nginx in front of the API: HTTPS, per-IP rate limits and a connection cap.
# limit_req_zone has to live in the http block; it is valid here because sites-enabled is included there.
limit_req_zone $binary_remote_addr zone=rucpy:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=rucpy_search:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=rucpy_conn:10m;

# Behind Cloudflare, also accept only its addresses so nobody can skip it by calling the server's IP.
# $realip_remote_addr is the connecting address, before set_real_ip_from rewrites $remote_addr.
# geo $realip_remote_addr $rucpy_via_cloudflare {
#     default 0;
#     173.245.48.0/20 1;   # ... every range in https://www.cloudflare.com/ips/
# }

server {
    listen 80;
    listen [::]:80;
    server_name ruc.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ruc.example.com;

    ssl_certificate /etc/ssl/ruc.example.com.pem;
    ssl_certificate_key /etc/ssl/ruc.example.com.key;

    # if ($rucpy_via_cloudflare = 0) { return 444; }

    limit_conn rucpy_conn 10;
    limit_conn_status 429;
    limit_req_status 429;

    # Searches are the only expensive request.
    location = /v1/search {
        limit_req zone=rucpy_search burst=10 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        limit_req zone=rucpy burst=30 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    access_log /var/log/nginx/rucpy.access.log;
    error_log /var/log/nginx/rucpy.error.log;
}
