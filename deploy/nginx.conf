# nginx in front of the API: HTTPS and a per-IP rate limit.
# limit_req_zone has to live in the http block; it is valid here because sites-enabled is included there.
limit_req_zone $binary_remote_addr zone=rucpy:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name ruc.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ruc.example.com;

    ssl_certificate /etc/ssl/ruc.example.com.pem;
    ssl_certificate_key /etc/ssl/ruc.example.com.key;

    location / {
        limit_req zone=rucpy burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    access_log /var/log/nginx/rucpy.access.log;
    error_log /var/log/nginx/rucpy.error.log;
}
